name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Build needs no real credentials: the Firebase Admin SDK is pointed at an
      # emulator host (never contacted during build) and auth uses a dummy secret.
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
      FIREBASE_PROJECT_ID: demo-tripplanner
      AUTH_SECRET: ci-only-not-a-secret
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Firestore emulator (integration tests) needs Java 21.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm run test:int
      - run: npm run build
